<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Bar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    
<aside class="p-4 rounded-4 shadow-sm bg-white">
    <h2 class="fw-bold mb-4 text-dark"> Filter </h2>
    
    <!-- Price-->
    <h4 class="fw-bold mb-2 text-dark"> Price </h4>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="under5">
        <label class="form-check-label" for="under5"> Under $5 </label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="5to10">
        <label class="form-check-label" for="5to10"> $5 - $10 </label>
    </div>
    <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="above10">
        <label class="form-check-label" for="above10"> Above $10 </label>
    </div>

    <!-- Area -->
    <h4 class="fw-bold mb-2 text-dark"> Area </h4>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="Bugis">
        <label class="form-check-label" for="Bugis"> Bugis </label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="Clementi">
        <label class="form-check-label" for="Clementi"> Clementi </label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="Chinatown">
        <label class="form-check-label" for="Chinatown"> Chinatown </label>
    </div>
    <div class="form-check mb-2">
        <input class="form-check-input" type="checkbox" id="Dover">
        <label class="form-check-label" for="Dover"> Dover </label>
    </div>
    <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="Orchard">
        <label class="form-check-label" for="Orchard"> Orchard </label>
    </div>


    <button id="apply-filter-btn" class="btn btn-warning w-100"> Apply Filter </button>
</aside>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
